<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #222631;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { text-align: center; font-weight: 600; margin: 0 0 32px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 16px 20px;
      background: var(--card);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: background .15s, transform .15s;
    }
    a.tile:hover { background: var(--card-hover); transform: translateY(-2px); }
    .tile img, .tile .fallback {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .tile .fallback {
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #2a2f3a;
      font-size: 28px;
      font-weight: 700;
    }
    .dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.running { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.stopped { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .name { font-weight: 600; }
    .desc { font-size: 13px; color: var(--muted); text-align: center; }
    .start {
      margin-top: 4px;
      padding: 6px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .start:disabled { opacity: .6; cursor: default; }
    .start:not(:disabled):hover {
      transform: scale(1.08);
      filter: brightness(1.1);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 50%, transparent);
    }
    .start:not(:disabled):active { transform: scale(.96); }
  </style>
</head>
<body>
  <h1>Ultra Simple Dashboard</h1>
  <div id="grid"></div>
  <script src="/static/app.js"></script>
</body>
</html>
