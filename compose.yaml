services:
  app:
    build: .
    image: simple-dashboard
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file: ".env"
    volumes:
      - ./app:/app/app
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    develop:
      watch:
        - action: rebuild
          path: uv.lock
